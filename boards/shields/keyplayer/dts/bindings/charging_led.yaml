description: Charging Status LED Indicator

compatible: "zmk,charging-led"

properties:
  led-gpios:
    type: phandle-array
    required: true
    description: >
      GPIO pin for charging indicator LED.
      Typically use GPIO_ACTIVE_HIGH for LED anode connected to GPIO,
      GPIO_ACTIVE_LOW for LED cathode connected to GPIO.

  active-low:
    type: boolean
    description: >
      If true, the LED is on when the GPIO output is low.
      This should match the GPIO flags in led-gpios.
      If not specified, defaults to false.

  label:
    type: string
    description: Human-readable string describing the device.