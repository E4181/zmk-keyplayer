description: TP4056 Charging Status Detector
compatible: "charging-status"

include:
  - base.yaml
  - gpio.yaml

properties:
  status-gpios:
    required: true
    type: phandle-array
    description: GPIO pin for CHRG signal (active low)

  label:
    type: string
    description: Human readable string describing the device